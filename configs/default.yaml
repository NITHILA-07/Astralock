simulation:
  dt: 0.02              # 50 Hz simulation loop (seconds per frame)
  duration: 15.0        # Total simulation duration (seconds)
  seed: 42              # Deterministic seed for reproducible benchmarks

camera:
  width: 640            # Frame width (pixels)
  height: 480           # Frame height (pixels)
  fov_x_deg: 10.0       # Horizontal Field of View (degrees)
  exposure_intensity: 255.0
  psf_sigma: 2.5        # Beam spot Gaussian spread (pixels)
  ambient_noise_std: 6.0 # Sensor dark/ambient noise

target:
  trajectory_type: "curved"  # Options: constant_velocity, curved, sudden_change, spiral
  beacon_intensity: 240.0    # Peak optical beacon intensity
  speed_deg_s: 1.5           # Angular speed (degrees/second)
  center_offset_deg: [0.0, 0.0]

disturbances:
  sensor_noise: true
  sensor_noise_sigma: 5.0
  platform_jitter: true
  jitter_freq_hz: 3.0        # Platform vibration frequency (Hz)
  jitter_amp_deg: 0.06       # Platform vibration amplitude (degrees)
  turbulence_disturbance: true
  turbulence_amp_px: 1.2     # Simplified beam wander displacement (pixels)
  occlusion_intervals:       # Temporary line-of-sight blockage [[t_start, t_end]]
    - [5.0, 6.0]

detection:
  threshold_value: 120
  min_area_px: 4
  max_area_px: 800

tracking:
  method: "predictive"       # "baseline" (reactive centroid) vs "predictive" (latency-aware Kalman)
  latency_tau_s: 0.08        # Total loop latency (capture + compute + actuator: 80 ms)
  process_noise_pos: 0.02
  process_noise_vel: 0.8
  measurement_noise: 1.5

reacquisition:
  timeout_s: 0.25            # Time without detection before triggering reacquisition
  initial_roi_half_size: 40  # Initial bounding box half-size (pixels)
  expansion_rate_px_s: 80.0  # ROI expansion speed over time (pixels/sec)
  max_roi_half_size: 240     # Cap before switching to full frame

control:
  kp: 3.2                    # Proportional gain
  ki: 0.35                   # Integral gain
  kd: 0.08                   # Derivative gain
  max_angular_rate_deg_s: 15.0 # Pan-tilt slew rate limit (deg/s)

lock:
  error_threshold_px: 15.0   # Pixels from optical axis to consider "locked"
  min_consecutive_frames: 3  # Stable frames required to confirm lock
